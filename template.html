<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaithTree Presentation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; }
  
  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.6s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide.active { opacity: 1; z-index: 10; }
  
  .gradient-top, .gradient-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 35%;
    pointer-events: none;
  }
  .gradient-top {
    top: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);
  }
  .gradient-bottom {
    bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);
  }
  
  .bug {
    position: absolute;
    right: 48px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: dropBug 30s linear infinite;
    z-index: 20;
  }
  .bug img {
    width: 70%;
    height: 70%;
    object-fit: contain;
  }
  /* Fallback text logo if no image */
  .bug .fallback {
    font-weight: 700;
    font-size: 28px;
    color: #2c5f2d;
    letter-spacing: -1px;
  }
  
  @keyframes dropBug {
    0%   { top: 40px; }
    100% { top: calc(100% - 130px); }
  }
  
  .content {
    position: relative;
    z-index: 15;
    max-width: 900px;
    width: 85%;
    text-align: left;
    padding: 40px 60px;
    opacity: 0;
    animation: fadeInContent 1.2s ease 0.8s forwards;
  }
  .slide.active .content {
    /* restart animation on slide change if needed */
  }
  
  .content h1 {
    font-size: 3.2rem;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 1.5rem;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    letter-spacing: -0.5px;
  }
  .content ul {
    list-style: none;
    font-size: 1.55rem;
    line-height: 1.6;
  }
  .content li {
    margin-bottom: 0.7rem;
    padding-left: 1.4rem;
    position: relative;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  .content li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: #a8d5a2;
    font-weight: bold;
  }
  
  @keyframes fadeInContent {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  
  .controls {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 12px;
    opacity: 0.3;
    transition: opacity 0.3s;
  }
  .controls:hover { opacity: 1; }
  .controls button {
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .controls button:hover { background: rgba(0,0,0,0.8); }
  
  .progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: #a8d5a2;
    z-index: 50;
    transition: width 0.3s;
  }

  /* ---- Views (hub 1214): ?view=audience (default) | confidence | control | overlay ----
     The class goes on <html>. The audience view is the original look, untouched. */
  .slide .notes { display: none; }
  .blackout {
    position: fixed; inset: 0; background: #000; z-index: 1000;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
  }
  .blacked .blackout { opacity: 1; }
  .in-app .controls { display: none; }
  .in-app.view-audience, .in-app.view-audience * { cursor: none; }

  /* Confidence monitor: current + next slide, notes, clock and timer */
  .view-confidence .controls, .view-confidence .progress, .view-confidence .blackout,
  .view-control .controls, .view-control .progress, .view-control .blackout { display: none; }
  .view-confidence body, .view-control body { background: #111; }
  .cm {
    position: fixed; inset: 0; display: grid; gap: 12px; padding: 12px;
    grid-template-columns: 3fr 2fr; grid-template-rows: auto 3fr 2fr;
  }
  .cm-bar, .ctl-bar {
    grid-column: 1 / -1; display: flex; align-items: baseline; gap: 28px;
    font-variant-numeric: tabular-nums; font-size: 22px; color: #ccc;
  }
  .cm-clock, .cm-timer { font-size: 44px; font-weight: 700; color: #fff; }
  .cm-timer { color: #a8d5a2; }
  .cm-spacer { flex: 1; }
  .black-badge {
    display: none; background: #c0392b; color: #fff; font-weight: 700;
    padding: 2px 12px; border-radius: 4px; letter-spacing: 1px;
  }
  .blacked .black-badge { display: inline-block; }
  .cm-stage { position: relative; overflow: hidden; background: #000; border-radius: 6px; }
  .cm-next { opacity: 0.85; }
  .cm-label {
    position: absolute; top: 8px; left: 10px; z-index: 30; font-size: 16px;
    text-transform: uppercase; letter-spacing: 2px; color: #ccc;
  }
  .cm-canvas { position: absolute; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  .cm-end { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 72px; color: #666; }
  .cm-notes {
    grid-column: 1 / -1; overflow: auto; background: #000; border-radius: 6px;
    padding: 16px 24px; font-size: 34px; line-height: 1.35;
  }
  .cm-notes p + p { margin-top: 0.6em; }
  .cm-notes.empty { color: #555; }

  /* Control view: slide grid to jump to, transport buttons, clock */
  .view-control .slide { display: none; }
  .ctl { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px; overflow: hidden; }
  .ctl-bar button {
    background: #333; color: #fff; border: 1px solid #555; border-radius: 6px;
    padding: 8px 16px; font-size: 16px; cursor: pointer;
  }
  .blacked .ctl-black { background: #c0392b; border-color: #c0392b; }
  .ctl-grid {
    flex: 1; overflow: auto; display: grid; gap: 12px; align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .ctl-card {
    position: relative; aspect-ratio: 16 / 9; border: 3px solid transparent; border-radius: 6px;
    background: #000 center / cover no-repeat; color: #fff; text-align: left; cursor: pointer;
    padding: 0; overflow: hidden; font: inherit;
  }
  .ctl-card span {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px; font-size: 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  }
  .ctl-card.current { border-color: #c0392b; }
  .ctl-card.next { border-color: #a8d5a2; }

  /* Overlay (NDI key/fill): transparent background, foreground text only, lower-third placement */
  html.view-overlay, html.view-overlay body { background: transparent; }
  .view-overlay .slide { background-image: none !important; align-items: flex-end; }
  .view-overlay .gradient-top, .view-overlay .gradient-bottom, .view-overlay .bug,
  .view-overlay .progress, .view-overlay .controls, .view-overlay .blackout { display: none; }
  .view-overlay .content {
    width: 100%; max-width: none; text-align: center; padding: 4vh 8% 6vh;
    background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
  }
  .view-overlay .content h1 { font-size: 2.6rem; margin-bottom: 0.6rem; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
  .view-overlay .content li { padding-left: 0; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
  .view-overlay .content li::before { content: none; }
  .view-overlay.blacked .slide { opacity: 0; }
</style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="blackout" id="blackout"></div>
  
  <!-- SLIDES_PLACEHOLDER -->
  
  <div class="controls">
    <button onclick="prevSlide()">← Prev</button>
    <button onclick="nextSlide()">Next →</button>
    <button onclick="toggleFullscreen()">Fullscreen</button>
  </div>

<script>
  const slides = document.querySelectorAll('.slide');
  let current = 0;
  const progress = document.getElementById('progress');

  // View selection (hub 1214). The macOS app injects window.__presenterView before
  // load; a browser uses ?view=audience|confidence|control|overlay.
  const root = document.documentElement;
  const view = window.__presenterView || new URLSearchParams(location.search).get('view') || 'audience';
  const nativeBridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.presenter;
  const state = { black: false, timerStart: Date.now() };
  const viewHooks = [];
  root.classList.add('view-' + view);
  if (nativeBridge) root.classList.add('in-app');

  function showSlide(n) {
    slides.forEach((s, i) => s.classList.toggle('active', i === n));
    current = n;
    progress.style.width = ((n + 1) / slides.length * 100) + '%';
    
    // Restart content animation
    const content = slides[n].querySelector('.content');
    if (content) {
      content.style.animation = 'none';
      content.offsetHeight; // reflow
      content.style.animation = null;
    }
    
    // Optionally restart bug animation
    const bug = slides[n].querySelector('.bug');
    if (bug) {
      bug.style.animation = 'none';
      bug.offsetHeight;
      bug.style.animation = null;
    }

    viewHooks.forEach(fn => fn(n));
  }

  // Render a state. Never re-broadcasts, so every window can apply the same state.
  function applyState(s) {
    if (Number.isInteger(s.index) && s.index >= 0 && s.index < slides.length && s.index !== current) showSlide(s.index);
    if (typeof s.black === 'boolean') {
      state.black = s.black;
      root.classList.toggle('blacked', s.black);
    }
    if (typeof s.timerStart === 'number') state.timerStart = s.timerStart;
    renderClock();
  }

  function currentState() {
    return { index: current, black: state.black, timerStart: state.timerStart };
  }

  // Sync: inside the app, Swift owns the state and pushes it to all three windows.
  // In plain browsers, tabs of the same deck stay in step over a BroadcastChannel.
  const channel = (!nativeBridge && 'BroadcastChannel' in window) ? new BroadcastChannel('markdown-presenter:' + location.pathname) : null;
  if (channel) {
    channel.onmessage = (e) => {
      if (e.data && e.data.kind === 'state') applyState(e.data.state);
      if (e.data && e.data.kind === 'hello') channel.postMessage({ kind: 'state', state: currentState() });
    };
  }

  function requestState(patch) {
    if (nativeBridge) {
      nativeBridge.postMessage(Object.assign({ type: 'request' }, patch));
      return;
    }
    applyState(patch);
    if (channel) channel.postMessage({ kind: 'state', state: currentState() });
  }

  // PowerPoint/Proclaim behaviour: an advance key while blacked only lifts the black.
  function nextSlide() {
    if (state.black) return requestState({ black: false });
    if (current < slides.length - 1) requestState({ index: current + 1 });
  }
  function prevSlide() {
    if (state.black) return requestState({ black: false });
    if (current > 0) requestState({ index: current - 1 });
  }
  function toggleBlack() {
    requestState({ black: !state.black });
  }
  function resetTimer() {
    requestState({ timerStart: Date.now() });
  }
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }
  
  document.addEventListener('keydown', (e) => {
    // In the app, keys are routed natively so every window and clicker behaves the same.
    if (nativeBridge) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown') { e.preventDefault(); nextSlide(); }
    if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); prevSlide(); }
    if (k === 'b' || k === 'B' || k === '.') toggleBlack();
    if (k === 'f' || k === 'F') toggleFullscreen();
    if (k === 'Home') requestState({ index: 0 });
    if (k === 'End') requestState({ index: slides.length - 1 });
  });
  
  // Touch swipe support
  let touchStartX = 0;
  document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
  document.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff) > 50) {
      if (diff > 0) nextSlide(); else prevSlide();
    }
  });

  // ---- Clock and timer (confidence and control views) ----
  function pad(n) { return String(n).padStart(2, '0'); }
  function renderClock() {
    const now = new Date();
    const secs = Math.max(0, Math.floor((Date.now() - state.timerStart) / 1000));
    const timer = (secs >= 3600 ? Math.floor(secs / 3600) + ':' : '') + pad(Math.floor(secs / 60) % 60) + ':' + pad(secs % 60);
    const clock = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = clock; });
    document.querySelectorAll('[data-timer]').forEach(el => { el.textContent = timer; });
  }

  function slideTitle(i) {
    const h = slides[i] && slides[i].querySelector('h1');
    return h ? h.textContent : '';
  }

  // ---- Confidence view: real slides scaled into a 1920x1080 stage, a cloned next slide, notes ----
  function setupConfidence() {
    const cm = document.createElement('div');
    cm.className = 'cm';
    cm.innerHTML =
      '<header class="cm-bar"><span class="cm-pos"></span><span class="black-badge">BLACK</span>' +
      '<span class="cm-spacer"></span><span class="cm-timer" data-timer></span><span class="cm-clock" data-clock></span></header>' +
      '<section class="cm-stage cm-current"><div class="cm-canvas"></div></section>' +
      '<section class="cm-stage cm-next"><div class="cm-label">Next</div><div class="cm-canvas"></div><div class="cm-end">End</div></section>' +
      '<section class="cm-notes"></section>';
    document.body.appendChild(cm);
    const [curCanvas, nextCanvas] = cm.querySelectorAll('.cm-canvas');
    const pos = cm.querySelector('.cm-pos');
    const notes = cm.querySelector('.cm-notes');
    const endCard = cm.querySelector('.cm-end');
    slides.forEach(s => curCanvas.appendChild(s));
    const clones = Array.from(slides, s => {
      const c = s.cloneNode(true);
      c.classList.remove('active');
      nextCanvas.appendChild(c);
      return c;
    });

    function fit() {
      [curCanvas, nextCanvas].forEach(c => {
        const box = c.parentElement.getBoundingClientRect();
        const scale = Math.min(box.width / 1920, box.height / 1080);
        c.style.transform = 'scale(' + scale + ')';
        c.style.left = ((box.width - 1920 * scale) / 2) + 'px';
        c.style.top = ((box.height - 1080 * scale) / 2) + 'px';
      });
    }
    window.addEventListener('resize', fit);
    fit();

    viewHooks.push(n => {
      clones.forEach((c, i) => c.classList.toggle('active', i === n + 1));
      endCard.style.display = n + 1 < slides.length ? 'none' : 'flex';
      pos.textContent = 'Slide ' + (n + 1) + ' / ' + slides.length;
      const src = slides[n].querySelector('.notes');
      notes.innerHTML = src ? src.innerHTML : '';
      if (!src) notes.textContent = 'No notes';
      notes.classList.toggle('empty', !src);
      notes.scrollTop = 0;
    });
  }

  // ---- Control view: transport buttons plus a grid of every slide ----
  function setupControl() {
    const ctl = document.createElement('div');
    ctl.className = 'ctl';
    ctl.innerHTML =
      '<header class="ctl-bar"><button data-act="prev">&larr; Prev</button><button data-act="next">Next &rarr;</button>' +
      '<button class="ctl-black" data-act="black">Black (B)</button><button data-act="timer">Reset timer</button>' +
      '<span class="cm-pos"></span><span class="black-badge">BLACK</span><span class="cm-spacer"></span>' +
      '<span class="cm-timer" data-timer></span><span class="cm-clock" data-clock></span></header>' +
      '<div class="ctl-grid"></div>';
    document.body.appendChild(ctl);
    const grid = ctl.querySelector('.ctl-grid');
    const pos = ctl.querySelector('.cm-pos');
    const cards = Array.from(slides, (s, i) => {
      const b = document.createElement('button');
      b.className = 'ctl-card';
      b.style.backgroundImage = s.style.backgroundImage;
      const label = document.createElement('span');
      label.textContent = (i + 1) + '. ' + slideTitle(i);
      b.appendChild(label);
      b.addEventListener('click', () => requestState({ index: i, black: false }));
      grid.appendChild(b);
      return b;
    });
    const actions = { prev: prevSlide, next: nextSlide, black: toggleBlack, timer: resetTimer };
    ctl.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => actions[b.dataset.act]()));
    viewHooks.push(n => {
      cards.forEach((c, i) => {
        c.classList.toggle('current', i === n);
        c.classList.toggle('next', i === n + 1);
      });
      pos.textContent = 'Slide ' + (n + 1) + ' / ' + slides.length;
      cards[n].scrollIntoView({ block: 'nearest' });
    });
  }

  // Only the audience view makes sound (play does not bubble, so listen in the capture phase).
  if (view !== 'audience') document.addEventListener('play', e => { e.target.muted = true; }, true);

  if (view === 'confidence') setupConfidence();
  if (view === 'control') setupControl();
  if (view === 'confidence' || view === 'control') setInterval(renderClock, 1000);

  // Bridge surface for the macOS app (evaluateJavaScript calls presenter.apply).
  window.presenter = {
    view: view,
    count: slides.length,
    apply: applyState,
    state: currentState,
    titles: () => Array.from(slides, (s, i) => slideTitle(i))
  };

  showSlide(0);
  renderClock();
  if (nativeBridge) nativeBridge.postMessage({ type: 'ready', view: view, count: slides.length, titles: window.presenter.titles() });
  if (channel) channel.postMessage({ kind: 'hello' });
</script>
</body>
</html>
