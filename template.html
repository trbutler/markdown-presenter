<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaithTree Presentation</title>
<style>
  /* Olivette, SIL OFL. Variable faces first in the cascade for browsers
     that understand a weight range; static faces cover the rest. */
  @font-face {
    font-family: "Olivette";
    src: url("fonts/olivette/Olivette-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Olivette";
    src: url("fonts/olivette/Olivette-Bold.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Olivette";
    src: url("fonts/olivette/Olivette-Italic.woff2") format("woff2");
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }
  @font-face {
    font-family: "Olivette";
    src: url("fonts/olivette/Olivette-BoldItalic.woff2") format("woff2");
    font-weight: 700;
    font-style: italic;
    font-display: swap;
  }
  @font-face {
    font-family: "Olivette";
    src: url("fonts/olivette/Olivette[opsz,wght].woff2") format("woff2-variations");
    font-weight: 400 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Olivette";
    src: url("fonts/olivette/Olivette-Italic[opsz,wght].woff2") format("woff2-variations");
    font-weight: 400 700;
    font-style: italic;
    font-display: swap;
  }
  /* D-DIN Condensed, Datto / Monotype, SIL OFL. Reserved name: keep the family name. */
  @font-face {
    font-family: "D-DIN Condensed";
    src: url("fonts/d-din/D-DINCondensed.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "D-DIN Condensed";
    src: url("fonts/d-din/D-DINCondensed-Bold.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: "Olivette", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; }
  button { font-family: inherit; }

  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.6s ease;
    --slide-left: 64px;
    --bug-size: 12.31vh;
    --bug-right: 48px;
    --bug-gap: 40px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 108px 0 88px;
  }
  .slide.active { opacity: 1; z-index: 10; }

  .slide-bg {
    position: absolute;
    inset: -12px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
  }
  .slide.active .slide-bg {
    animation: blurBg 2.5s ease forwards;
  }
  @keyframes blurBg {
    from { filter: blur(0px); }
    to   { filter: blur(3px); }
  }

  .gradient-top, .gradient-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 35%;
    pointer-events: none;
    z-index: 1;
  }
  .gradient-top {
    top: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);
  }
  .gradient-bottom {
    bottom: 0;
    height: 68%;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.78) 46%, rgba(0,0,0,0.4) 78%, transparent 100%);
  }

  .kicker {
    position: absolute;
    top: 42px;
    left: var(--slide-left);
    z-index: 16;
    max-width: 70%;
    font-family: "D-DIN Condensed", "Arial Narrow", sans-serif;
    font-size: 3.33vh;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.65);
    opacity: 0;
    animation: fadeInContent 1.2s ease 0.3s forwards;
  }

  .bug {
    position: absolute;
    right: var(--bug-right);
    width: var(--bug-size);
    height: var(--bug-size);
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: dropBug 30s linear infinite;
    z-index: 20;
  }
  .bug img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .bug .fallback {
    font-weight: 700;
    font-size: 28px;
    color: #2c5f2d;
    letter-spacing: -1px;
  }

  @keyframes dropBug {
    0%   { top: 40px; }
    100% { top: calc(100% - var(--bug-size) - 40px); }
  }

  .content {
    position: relative;
    z-index: 15;
    width: calc(100% - var(--slide-left) - var(--bug-right) - var(--bug-size) - var(--bug-gap));
    margin-left: var(--slide-left);
    text-align: left;
    padding: 12px 0;
    font-size: 5.09vh;
    opacity: 0;
    animation: fadeInContent 1.2s ease 2.5s forwards;
    --content-shadow:
      0 0 2px rgba(0,0,0,0.95),
      0 0 6px rgba(0,0,0,0.85),
      0 0 18px rgba(0,0,0,0.65);
    text-shadow: var(--content-shadow);
  }

  .content h1 {
    font-size: 2.11em;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 0.2em;
    letter-spacing: -0.02em;
  }
  .content .subtitle {
    font-size: 0.98em;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 0.75em;
  }
  .content ul {
    list-style: none;
    font-size: calc(49 / 1080 * 100vh);
    line-height: 1.35;
    margin-top: 0.3em;
  }
  .content li {
    margin-bottom: 0.28em;
    padding-left: 1.15em;
    position: relative;
  }
  .content li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: #a8d5a2;
    font-weight: bold;
  }

  .slide-video { padding: 0; }
  .slide-video video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  /* Portrait treatment. The canvas is a soft enlargement of the same
     frame. The sharp video keeps its own shape on top of it. */
  .slide-video canvas.video-fill {
    position: absolute;
    inset: -10%;
    width: 120%;
    height: 120%;
    z-index: 0;
    filter: blur(4vh);
  }
  .slide-video .video-fit {
    z-index: 1;
    object-fit: contain;
    background: transparent;
  }

  /* Lower third. --lt-x is how far the logo still has to travel.
     The bar is clipped by the same distance, so the logo wipes it on. */
  @property --lt-x {
    syntax: "<length>";
    inherits: true;
    initial-value: 100vw;
  }
  .lower-third {
    --lt-size: 15.8vh;
    --lt-safe: 5vh;
    --lt-bar-h: 13.6vh;
    --lt-right: 21.5vw;
    --lt-x: 100vw;
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    opacity: 1;
  }
  .lower-third.is-on {
    --lt-x: 0px;
    transition: --lt-x 1500ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .lower-third.is-out {
    opacity: 0;
    transition: --lt-x 1500ms cubic-bezier(0.22, 0.61, 0.36, 1), opacity 2000ms linear;
  }
  .lt-logo {
    position: absolute;
    left: calc(var(--lt-safe) + var(--lt-x));
    bottom: var(--lt-safe);
    width: var(--lt-size);
    height: var(--lt-size);
    z-index: 2;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.35));
  }
  .lt-window {
    position: absolute;
    left: calc(var(--lt-safe) + var(--lt-size) * 0.5);
    right: var(--lt-right);
    bottom: calc(var(--lt-safe) + (var(--lt-size) - var(--lt-bar-h)) / 2);
    height: var(--lt-bar-h);
    overflow: hidden;
    border-radius: 0 3.4vh 3.4vh 0;
    clip-path: inset(0 0 0 var(--lt-x) round 0 3.4vh 3.4vh 0);
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.28));
  }
  .lt-bar {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: calc(100vw - var(--lt-safe) - var(--lt-right) - var(--lt-size) * 0.5);
    display: flex;
    flex-direction: column;
  }
  .lt-name, .lt-title {
    display: flex;
    align-items: center;
    min-height: 0;
    padding: 0 1.4em 0 calc(var(--lt-size) * 0.5 + 1.4vh);
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    font-family: "Olivette", sans-serif;
  }
  .lt-name {
    flex: 1.29;
    background: #3c4b29;
    font-weight: 700;
    font-size: 4.45vh;
    letter-spacing: -0.02em;
  }
  .lt-title {
    flex: 1;
    background: rgba(60, 75, 41, 0.5);
    font-weight: 400;
    font-size: 3.15vh;
    color: rgba(255, 255, 255, 0.94);
  }

  @keyframes fadeInContent {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .controls {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 12px;
    opacity: 0.3;
    transition: opacity 0.3s;
  }
  .controls:hover { opacity: 1; }
  .controls button {
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .controls button:hover { background: rgba(0,0,0,0.8); }

  .progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: #a8d5a2;
    z-index: 50;
    transition: width 0.3s;
  }
  body.no-chrome .progress,
  body.no-chrome .controls {
    display: none;
  }
  /* Views (hub 1213). ?view=audience|notes|lyrics|overlay|service puts
     view-<name> on <html> and <body>. Audience is the default. */
  .notes { display: none; }
  .notes-panel, .status-bar, .service-panel, .countdown, .black-badge { display: none; }

  body.blacked:not(.view-notes):not(.view-service) .slide,
  body.blacked:not(.view-notes):not(.view-service) .countdown {
    visibility: hidden;
  }

  .countdown {
    position: fixed;
    top: 4vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    padding: 0.35em 0.9em;
    border-radius: 0.4em;
    background: rgba(0,0,0,0.55);
    font-family: "D-DIN Condensed", "Arial Narrow", sans-serif;
    font-size: 4.2vh;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  body.has-countdown:not(.view-notes):not(.view-service):not(.view-lyrics) .countdown { display: block; }

  /* Lyrics: words only, on a transparent page, for an OBS browser source. */
  html.view-lyrics, body.view-lyrics,
  html.view-overlay, body.view-overlay { background: transparent; }
  .view-lyrics .slide-bg,
  .view-lyrics .gradient-top,
  .view-lyrics .gradient-bottom,
  .view-lyrics .bug,
  .view-lyrics .kicker,
  .view-lyrics .slide-video,
  .view-lyrics .lower-third { display: none; }
  .view-lyrics .content {
    --content-shadow:
      0 0 3px rgba(0,0,0,1),
      0 0 8px rgba(0,0,0,0.95),
      0 0 22px rgba(0,0,0,0.8);
  }

  /* Overlay: only graphics that sit over a camera (lower thirds, countdown). */
  .view-overlay .slide-bg,
  .view-overlay .gradient-top,
  .view-overlay .gradient-bottom,
  .view-overlay .bug,
  .view-overlay .kicker,
  .view-overlay .content,
  .view-overlay .slide-video video,
  .view-overlay .slide-video canvas { display: none; }

  /* Notes: the slide small at top left, notes on the right, status below. */
  body.view-notes { background: #111; }
  body.view-notes .slide {
    width: 100vw;
    height: 100vh;
    transform: scale(0.6);
    transform-origin: 0 0;
    outline: 2px solid #333;
  }
  body.view-notes .notes-panel {
    display: block;
    position: fixed;
    top: 0; right: 0; bottom: 0;
    left: 61vw;
    padding: 3vh 2.5vw;
    overflow: auto;
    background: #181818;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 3.4vh;
    line-height: 1.4;
  }
  .notes-panel .notes-title { font-size: 0.7em; color: #a8d5a2; margin-bottom: 0.8em; text-transform: uppercase; letter-spacing: 0.08em; }
  .notes-panel p { margin-bottom: 0.8em; }
  .notes-panel .empty { color: #777; font-style: italic; }
  body.view-notes .status-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 1.2em 2em;
    position: fixed;
    top: 62vh;
    left: 2vw;
    width: 57vw;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 2.8vh;
    color: #ddd;
  }
  .status-bar .clock { font-size: 1.6em; font-variant-numeric: tabular-nums; color: #fff; }
  .status-bar .next { flex-basis: 100%; color: #aaa; }
  .status-bar .countdown-copy:empty { display: none; }
  body.view-notes.blacked .black-badge,
  body.view-service.blacked .black-badge {
    display: block;
    position: fixed;
    top: 1vh; left: 1vw;
    z-index: 300;
    padding: 0.3em 0.8em;
    background: #b00020;
    color: #fff;
    font: 700 2.4vh -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    border-radius: 0.3em;
  }
  body.view-notes .controls { left: 30vw; opacity: 0.8; }

  /* Service order: every section and slide heading, click to jump.
     view=service is the whole page; S opens it over any other view. */
  body.view-service { background: #111; }
  body.view-service .slide,
  body.view-service .progress { display: none; }
  body.view-service .service-panel,
  body.service-open .service-panel {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 200;
    overflow: auto;
    padding: 3vh 4vw 12vh;
    background: rgba(17,17,17,0.97);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 20px;
  }
  body.service-open:not(.view-service) .service-panel { inset: 6vh 18vw; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .service-panel h2 { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.1em; color: #a8d5a2; margin: 1.4em 0 0.4em; }
  .service-panel ol { list-style: none; }
  .service-panel button {
    display: flex;
    gap: 1em;
    width: 100%;
    text-align: left;
    padding: 0.45em 0.7em;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #eee;
    font-size: 1em;
    cursor: pointer;
  }
  .service-panel button:hover { background: #2a2a2a; }
  .service-panel button.current { background: #3c4b29; color: #fff; }
  .service-panel .num { width: 2.5em; color: #888; font-variant-numeric: tabular-nums; }
  .service-panel .sub { color: #999; margin-left: auto; font-size: 0.85em; }
  .service-panel .filler .label { font-style: italic; }

  /* Notes view (also ?view=confidence, hub 1214): the next slide small
     beside the status, and the elapsed timer. */
  .next-preview, .transport { display: none; }
  body.view-notes .status-bar { width: 31vw; }
  body.view-notes .next-preview {
    display: block;
    position: fixed;
    top: 62vh;
    left: 35vw;
    width: 25vw;
    height: 25vh;
    overflow: hidden;
    background: #000;
    outline: 2px solid #333;
  }
  body.view-notes .next-preview .slide {
    width: 100vw;
    height: 100vh;
    transform: scale(0.25);
    transform-origin: 0 0;
    outline: none;
  }
  .next-preview .next-label {
    position: absolute;
    top: 0.5vh; left: 0.6vw;
    z-index: 30;
    font: 1.8vh -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #ccc;
    text-shadow: 0 0 4px #000;
  }
  .next-preview .next-end {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    font: 4vh -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #666;
  }
  .status-bar .timer { font-size: 1.6em; font-variant-numeric: tabular-nums; color: #a8d5a2; }

  /* Service view (also ?view=control, hub 1214): transport buttons, the
     slide number, the timer and the clock along the bottom. */
  body.view-service .controls { display: none; }
  body.view-service .transport {
    display: flex;
    align-items: center;
    gap: 12px;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 210;
    padding: 10px 4vw;
    background: #1b1b1b;
    border-top: 1px solid #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    color: #ddd;
    font-variant-numeric: tabular-nums;
  }
  .transport button {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 16px;
    cursor: pointer;
  }
  body.blacked .transport [data-act="black"] { background: #b00020; border-color: #b00020; }
  .transport .spacer { flex: 1; }
  .transport .timer { font-size: 1.5em; color: #a8d5a2; }
  .transport .clock { font-size: 1.5em; color: #fff; }

  /* Inside the macOS app the windows have no on-page buttons, and the
     projector shows no pointer. */
  .in-app .controls { display: none; }
  .in-app.view-audience, .in-app.view-audience * { cursor: none; }
</style>
</head>
<body>
  <div class="progress" id="progress"></div>

  <!-- SLIDES_PLACEHOLDER -->

  <div class="countdown" id="countdown"></div>
  <div class="black-badge" id="blackBadge">Screen is black (B to restore)</div>
  <aside class="notes-panel" id="notesPanel"><div class="notes-title" id="notesTitle"></div><div id="notesBody"></div></aside>
  <div class="status-bar" id="statusBar"></div>
  <nav class="service-panel" id="servicePanel" aria-label="Service order"></nav>
  <div class="next-preview" id="nextPreview"><div class="next-label">Next</div><div class="next-end" id="nextEnd">End</div></div>
  <div class="transport" id="transport">
    <button type="button" data-act="prev">← Prev</button>
    <button type="button" data-act="next">Next →</button>
    <button type="button" data-act="black">Black (B)</button>
    <button type="button" data-act="timer">Reset timer</button>
    <span class="pos"></span>
    <span class="spacer"></span>
    <span class="timer" data-timer></span>
    <span class="clock" data-clock></span>
  </div>

  <div class="controls">
    <button onclick="prevSlide()">← Prev</button>
    <button onclick="nextSlide()">Next →</button>
    <button onclick="toggleFullscreen()">Fullscreen</button>
  </div>

<script>
  const deck = /* DECK_CONFIG */;
  const params = new URLSearchParams(location.search);
  // In the macOS app (hub 1214) each view is a WKWebView. Swift owns the
  // show state and pushes it to every view through presenter.apply(); the
  // page asks for changes instead of making them.
  const nativeBridge = (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.presenter) || null;
  if (nativeBridge) document.documentElement.classList.add('in-app');
  if (params.has('seed')) deck.seed = Number(params.get('seed'));
  // The app gives all its views one seed, so they agree on the filler order.
  else if (deck.seed == null && typeof window.__presenterSeed === 'number') deck.seed = window.__presenterSeed;
  if (/^(0|off|false|no)$/i.test(params.get('chrome') || '')) {
    document.body.classList.add('no-chrome');
  }

  let playOrder = [];
  let current = 0;
  let advanceTimer = null;
  const progress = document.getElementById('progress');
  const player = new Audio();
  player.loop = true;
  player.preload = 'auto';
  let fadeToken = 0;
  let currentSrc = null;
  let heldTime = 0;
  let heldForVideo = false;

  // ---- Views (hub 1213) ----------------------------------------------
  // confidence and control are the macOS app's names (hub 1214) for the
  // notes and service views. The app sets window.__presenterView in case a
  // file URL loses its query.
  const views = ['audience', 'notes', 'lyrics', 'overlay', 'service'];
  const viewAliases = { confidence: 'notes', control: 'service' };
  const askedView = String(window.__presenterView || params.get('view') || 'audience').toLowerCase();
  let view = viewAliases[askedView] || askedView;
  if (!views.includes(view)) view = 'audience';
  document.documentElement.classList.add('view-' + view);
  document.body.classList.add('view-' + view);
  document.body.dataset.view = view;
  if (view === 'lyrics' || view === 'overlay') document.body.classList.add('no-chrome');
  // Only the audience view makes sound. The others are control screens or keys.
  const silent = view !== 'audience' || /^(1|on|true|yes)$/i.test(params.get('mute') || '');
  if (silent) {
    player.muted = true;
    document.querySelectorAll('video').forEach(video => { video.muted = true; });
  }

  const countdownEl = document.getElementById('countdown');
  const notesTitle = document.getElementById('notesTitle');
  const notesBody = document.getElementById('notesBody');
  const statusBar = document.getElementById('statusBar');
  const servicePanel = document.getElementById('servicePanel');
  const nextPreview = document.getElementById('nextPreview');
  const nextEnd = document.getElementById('nextEnd');
  const transport = document.getElementById('transport');
  let blacked = false;
  let timerStart = Date.now();
  // Timers, countdowns and video ends move the show on. In the app only the
  // audience view runs them, so four windows never advance four times.
  const leads = !nativeBridge || view === 'audience';

  // The deck's own slides; the notes view's next-slide copy is not one.
  function deckSlides() {
    return document.querySelectorAll('body > .slide');
  }

  // Windows of the same deck follow each other: open ?view=notes on the
  // laptop and the plain deck on the projector, and either one drives.
  const peerId = Math.random().toString(36).slice(2);
  let joining = true;
  // Inside the app Swift relays instead, so the channel stays closed there.
  let channel = null;
  if (!nativeBridge) {
    try { channel = new BroadcastChannel('mdp:' + location.pathname); } catch (err) { channel = null; }
  }
  function post(msg) {
    if (!channel) return;
    msg.from = peerId;
    try { channel.postMessage(msg); } catch (err) {}
  }
  function nodeIndex(slide) {
    return [...deckSlides()].indexOf(slide);
  }
  if (channel) {
    channel.onmessage = (event) => {
      const msg = event.data || {};
      if (msg.from === peerId) return;
      // A reply to a hello is only for a window still waiting to join:
      // one that has moved since must not be pulled back by a late reply.
      if (msg.type === 'show' && msg.reply && !joining) return;
      if (msg.type === 'show') {
        const node = deckSlides()[msg.node];
        let n = msg.n;
        if (!playOrder[n] || playOrder[n].slide !== node) {
          const k = playOrder.findIndex(item => item.slide === node);
          if (k >= 0) n = k;
        }
        if (playOrder[n] && n !== current) showSlide(n, true);
        if (typeof msg.black === 'boolean' && msg.black !== blacked) setBlack(msg.black, true);
        if (typeof msg.timerStart === 'number') timerStart = msg.timerStart;
      } else if (msg.type === 'black') {
        setBlack(!!msg.on, true);
      } else if (msg.type === 'timer') {
        if (typeof msg.start === 'number') timerStart = msg.start;
      } else if (msg.type === 'hello') {
        post({ type: 'show', reply: true, n: current, node: nodeIndex(playOrder[current] && playOrder[current].slide), black: blacked, timerStart: timerStart });
      }
    };
  }

  function setBlack(on, fromRemote) {
    blacked = !!on;
    document.documentElement.classList.toggle('blacked', blacked);
    document.body.classList.toggle('blacked', blacked);
    if (!fromRemote) post({ type: 'black', on: blacked });
    updateStatus();
    updateTransport();
  }

  function setTimerStart(start, fromRemote) {
    timerStart = start;
    if (!fromRemote) post({ type: 'timer', start: start });
    tick();
  }

  // Every change the operator asks for comes through here. A browser page
  // makes it and tells its peers; in the app it goes to Swift, which pushes
  // the new state to every view (applyState below).
  function requestState(patch) {
    if (nativeBridge) {
      nativeBridge.postMessage(Object.assign({ type: 'request' }, patch));
      return;
    }
    if (typeof patch.index === 'number' && playOrder[patch.index]) showSlide(patch.index);
    if (typeof patch.black === 'boolean' && patch.black !== blacked) setBlack(patch.black);
    if (typeof patch.timerStart === 'number') setTimerStart(patch.timerStart);
  }

  // Draws a state pushed by the app. It never posts back, so pushing the
  // same state to every view cannot loop.
  function applyState(s) {
    if (!s) return;
    if (Number.isInteger(s.index) && playOrder[s.index] && s.index !== current) showSlide(s.index, true);
    if (typeof s.black === 'boolean' && s.black !== blacked) setBlack(s.black, true);
    if (typeof s.timerStart === 'number') timerStart = s.timerStart;
    tick();
  }

  function goTo(n) {
    requestState({ index: n });
  }

  function sectionSpec(n) {
    const item = playOrder[n];
    if (!item) return null;
    return (deck.sections || [])[item.sectionIndex] || null;
  }

  function sectionBounds(n) {
    const s = playOrder[n].sectionIndex;
    let a = n;
    let b = n;
    while (a > 0 && playOrder[a - 1].sectionIndex === s) a--;
    while (b < playOrder.length - 1 && playOrder[b + 1].sectionIndex === s) b++;
    return [a, b];
  }

  // Timer-driven advance. A // cycle: section wraps to its own first slide;
  // the operator's Next on its last slide leaves it.
  function autoNext() {
    if (!leads) return;
    const spec = sectionSpec(current);
    if (spec && spec.cycle) {
      const [a, b] = sectionBounds(current);
      goTo(current < b ? current + 1 : a);
      return;
    }
    nextSlide();
  }

  function slideLabel(slide) {
    const pick = (sel) => {
      const el = slide.querySelector(sel);
      return el ? el.textContent.trim() : '';
    };
    const title = pick('.content h1');
    const kicker = pick('.kicker');
    if (title) return { label: title, sub: kicker };
    if (kicker) return { label: kicker, sub: '' };
    if (slide.dataset.kind === 'video') {
      const name = pick('.lt-name');
      return { label: 'Video: ' + (name || (slide.dataset.video || '').split('/').pop()), sub: '' };
    }
    const text = pick('.subtitle') || pick('.content li');
    return { label: text ? text.slice(0, 60) : '(untitled)', sub: '' };
  }

  // ---- Countdown to a clock time ----------------------------------------
  // ?now=10:25 pretends the clock says 10:25, for rehearsing a countdown.
  let clockOffset = 0;
  const nowParam = params.get('now');
  if (nowParam && /^\d{1,2}:\d{2}(:\d{2})?$/.test(nowParam)) {
    const [h, m, s] = nowParam.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m, s || 0, 0);
    clockOffset = d.getTime() - Date.now();
  }
  function clockNow() { return new Date(Date.now() + clockOffset); }
  function countdownTarget(hhmm) {
    const [h, m] = hhmm.split(':').map(Number);
    const now = clockNow();
    const target = new Date(now.getTime());
    target.setHours(h, m, 0, 0);
    if (target - now < -12 * 3600e3) target.setDate(target.getDate() + 1);
    return target;
  }
  function formatLeft(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor(total % 3600 / 60);
    const s = total % 60;
    const pad = (x) => String(x).padStart(2, '0');
    return h ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
  }
  // countdownEnd: next fires only when this window saw time left on that
  // section, so opening the deck late (or rehearsing after) never jumps.
  let countdownFiredFor = null;
  const countdownArmed = new Set();
  function countdownText() {
    const spec = sectionSpec(current);
    if (!spec || !spec.countdown) return '';
    const sectionIndex = playOrder[current].sectionIndex;
    const left = countdownTarget(spec.countdown) - clockNow();
    if (left > 0) countdownArmed.add(sectionIndex);
    if (left <= 0) {
      if (spec.countdownEnd === 'next' && leads && countdownArmed.has(sectionIndex) && countdownFiredFor !== sectionIndex) {
        countdownFiredFor = sectionIndex;
        const [, b] = sectionBounds(current);
        if (b < playOrder.length - 1) setTimeout(() => goTo(b + 1), 0);
      }
      return 'Starting now';
    }
    return (spec.countdownLabel || 'Service begins in') + ' ' + formatLeft(left);
  }
  function tick() {
    const text = countdownText();
    document.body.classList.toggle('has-countdown', !!text);
    if (countdownEl.textContent !== text) countdownEl.textContent = text;
    updateStatus();
    updateTransport();
  }

  // Time since the show (or the operator's Reset timer) started.
  function elapsedText() {
    const secs = Math.max(0, Math.floor((Date.now() - timerStart) / 1000));
    const pad = (x) => String(x).padStart(2, '0');
    return (secs >= 3600 ? Math.floor(secs / 3600) + ':' : '') + pad(Math.floor(secs / 60) % 60) + ':' + pad(secs % 60);
  }
  function clockText() {
    return clockNow().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }

  // ---- Notes, status and service order ----------------------------------
  function updateNotes() {
    if (view !== 'notes') return;
    const slide = playOrder[current] && playOrder[current].slide;
    if (!slide) return;
    notesTitle.textContent = slideLabel(slide).label;
    const aside = slide.querySelector('.notes');
    if (aside) notesBody.innerHTML = aside.innerHTML.trim();
    else notesBody.innerHTML = '<p class="empty">No notes for this slide.</p>';
    updateNextPreview();
  }

  // A still copy of the next slide: no video, no sound, no notes.
  function updateNextPreview() {
    nextPreview.querySelectorAll('.slide').forEach(el => el.remove());
    const next = playOrder[current + 1];
    nextEnd.style.display = next ? 'none' : 'flex';
    if (!next) return;
    const copy = next.slide.cloneNode(true);
    copy.querySelectorAll('video, canvas, .notes').forEach(el => el.remove());
    copy.classList.add('active');
    copy.setAttribute('aria-hidden', 'true');
    nextPreview.insertBefore(copy, nextPreview.firstChild);
    fitContent(copy);
  }

  function updateStatus() {
    if (view !== 'notes' || !playOrder.length) return;
    const spec = sectionSpec(current) || {};
    const next = playOrder[current + 1];
    const parts = [
      ['clock', clockText()],
      ['timer', elapsedText()],
      ['pos', 'Slide ' + (current + 1) + ' / ' + playOrder.length],
      ['section', spec.name || ''],
      ['countdown-copy', countdownText()],
      ['black', blacked ? 'BLACK' : ''],
      ['next', next ? 'Next: ' + slideLabel(next.slide).label : 'Next: (end)'],
    ];
    const html = parts.filter(p => p[1]).map(p => {
      const span = document.createElement('span');
      span.className = p[0];
      if (p[0] === 'clock' || p[0] === 'timer') span.setAttribute('data-' + p[0], '');
      span.textContent = p[1];
      return span.outerHTML;
    }).join('');
    if (statusBar.innerHTML !== html) statusBar.innerHTML = html;
  }

  function updateTransport() {
    if (view !== 'service' || !playOrder.length) return;
    const set = (sel, text) => {
      const el = transport.querySelector(sel);
      if (el.textContent !== text) el.textContent = text;
    };
    set('.pos', 'Slide ' + (current + 1) + ' / ' + playOrder.length + (blacked ? ' (black)' : ''));
    set('.timer', elapsedText());
    set('.clock', clockText());
  }

  function buildServicePanel() {
    servicePanel.textContent = '';
    let lastSection = null;
    let list = null;
    playOrder.forEach((item, i) => {
      if (item.sectionIndex !== lastSection) {
        lastSection = item.sectionIndex;
        const spec = (deck.sections || [])[lastSection] || {};
        const head = document.createElement('h2');
        head.textContent = spec.name || ('Section ' + (lastSection + 1));
        servicePanel.appendChild(head);
        list = document.createElement('ol');
        servicePanel.appendChild(list);
      }
      const info = slideLabel(item.slide);
      const li = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.index = String(i);
      if (item.slide.dataset.deck === 'filler') button.classList.add('filler');
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(i + 1);
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = info.label;
      button.append(num, label);
      if (info.sub) {
        const sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = info.sub;
        button.appendChild(sub);
      }
      button.addEventListener('click', () => {
        goTo(i);
        if (view !== 'service') closeService();
      });
      li.appendChild(button);
      list.appendChild(li);
    });
  }

  function markService() {
    servicePanel.querySelectorAll('button.current').forEach(b => b.classList.remove('current'));
    const button = servicePanel.querySelector('button[data-index="' + current + '"]');
    if (!button) return;
    button.classList.add('current');
    if (view === 'service' || document.body.classList.contains('service-open')) {
      button.scrollIntoView({ block: 'nearest' });
    }
  }
  function toggleService() {
    if (view === 'service') return;
    document.body.classList.toggle('service-open');
    markService();
  }
  function closeService() {
    document.body.classList.remove('service-open');
  }

  function afterShow(n, fromRemote) {
    updateNotes();
    markService();
    tick();
    if (!fromRemote) {
      joining = false;
      post({ type: 'show', n: n, node: nodeIndex(playOrder[n].slide), black: blacked });
    }
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function makeRng() {
    if (deck.seed == null || Number.isNaN(deck.seed)) {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return mulberry32(buf[0]);
    }
    return mulberry32(deck.seed);
  }

  function sample(rng, items, n) {
    const copy = items.slice();
    const out = [];
    for (let i = 0; i < n && copy.length; i++) {
      const j = Math.floor(rng() * copy.length);
      out.push(copy.splice(j, 1)[0]);
    }
    return out;
  }

  function buildPlayOrder() {
    const nodes = [...deckSlides()];
    const fillers = nodes.filter(s => s.dataset.deck === 'filler');
    const groups = (deck.sections || []).map(() => []);
    nodes.forEach(slide => {
      if (slide.dataset.deck === 'filler') return;
      const index = Number(slide.dataset.sectionIndex || 0);
      if (!groups[index]) groups[index] = [];
      groups[index].push(slide);
    });
    const rng = makeRng();
    const order = [];
    groups.forEach((slides, index) => {
      const spec = (deck.sections && deck.sections[index]) || { insert: 1 };
      const units = [];
      slides.forEach(slide => {
        if (slide.dataset.glued === '1' && units.length) units[units.length - 1].push(slide);
        else units.push([slide]);
      });
      const gaps = [];
      units.forEach((unit, unitIndex) => {
        const anchored = unitIndex === 0 && unit[0].dataset.glued === '1';
        if (!anchored) gaps.push(unitIndex);
      });
      const wanted = spec.insert == null ? 1 : spec.insert;
      const count = Math.min(wanted, gaps.length, fillers.length);
      const chosenGaps = sample(rng, gaps, count).sort((a, b) => a - b);
      const chosenFillers = sample(rng, fillers, count);
      const placed = new Map();
      chosenGaps.forEach((gap, i) => placed.set(gap, chosenFillers[i]));
      units.forEach((unit, unitIndex) => {
        if (placed.has(unitIndex)) order.push({ slide: placed.get(unitIndex), sectionIndex: index });
        unit.forEach(slide => order.push({ slide: slide, sectionIndex: index }));
      });
    });
    return order;
  }

  function resolveAudio(sectionIndex) {
    let track = deck.audio || null;
    const sections = deck.sections || [];
    const last = sectionIndex == null ? -1 : sectionIndex;
    for (let i = 0; i <= last; i++) {
      const audio = sections[i] && sections[i].audio;
      if (audio != null && audio !== '') track = audio;
    }
    if (!track || track === 'stop') return null;
    return track;
  }

  function fadeVolume(target, done) {
    const token = ++fadeToken;
    const from = player.volume;
    const ms = deck.fadeMs == null ? 2000 : deck.fadeMs;
    const started = performance.now();
    function step(now) {
      if (token !== fadeToken) return;
      const progress = ms <= 0 ? 1 : Math.min(1, (now - started) / ms);
      const next = from + (target - from) * progress;
      player.volume = Math.min(1, Math.max(0, next));
      if (progress < 1) requestAnimationFrame(step);
      else if (done) done();
    }
    requestAnimationFrame(step);
  }

  function settleAudio(slide, sectionIndex) {
    const track = resolveAudio(sectionIndex);
    if (slide.dataset.kind === 'video' || !track) {
      heldForVideo = slide.dataset.kind === 'video' && !!currentSrc;
      fadeVolume(0, () => {
        if (player.volume > 0.01) return;
        if (!player.paused) heldTime = player.currentTime;
        player.pause();
        if (!track) {
          currentSrc = null;
          heldTime = 0;
          heldForVideo = false;
        }
      });
      return;
    }
    const same = currentSrc === track;
    if (!same) {
      player.src = track;
      currentSrc = track;
      player.currentTime = 0;
      heldTime = 0;
    } else if (heldForVideo) {
      player.currentTime = heldTime;
    }
    heldForVideo = false;
    player.play().catch(() => {});
    if (!same || player.volume < 0.99) fadeVolume(1);
  }

  function fitContent(slide) {
    const box = slide.querySelector('.content');
    if (!box) return;
    box.style.fontSize = '';
    const max = parseFloat(getComputedStyle(box).fontSize);
    const min = max * 0.62;
    const cs = getComputedStyle(slide);
    const limitH = slide.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const fits = (size) => {
      box.style.fontSize = size + 'px';
      return box.scrollHeight <= limitH + 1 && box.scrollWidth <= box.clientWidth + 1;
    };
    if (fits(max)) return;
    let lo = min;
    let hi = max;
    let best = min;
    for (let i = 0; i < 10; i++) {
      const mid = (lo + hi) / 2;
      if (fits(mid)) { best = mid; lo = mid; }
      else hi = mid;
    }
    box.style.fontSize = best + 'px';
  }

  function indexFromHash() {
    const match = /^#(\d+)$/.exec(location.hash);
    if (!match) return 0;
    const n = parseInt(match[1], 10) - 1;
    if (n < 0 || n >= playOrder.length) return 0;
    return n;
  }

  function writeHash(n) {
    const next = '#' + (n + 1);
    if (location.hash === next) return;
    history.replaceState(null, '', next);
  }

  function restart(node, selector) {
    const el = node.querySelector(selector);
    if (!el) return;
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = null;
  }

  let lowerTimers = [];

  function clearLowerThird() {
    lowerTimers.forEach(clearTimeout);
    lowerTimers = [];
    document.querySelectorAll('.lower-third').forEach(el => {
      el.style.transition = 'none';
      el.classList.remove('is-on', 'is-out');
      void el.offsetWidth;
      el.style.transition = '';
    });
  }

  function startLowerThird(slide) {
    clearLowerThird();
    const el = slide.querySelector('.lower-third');
    if (!el) return;
    const buildIn = Number(el.dataset.buildIn);
    const buildOut = Number(el.dataset.buildOut);
    const stillHere = () => playOrder[current] && playOrder[current].slide === slide;
    lowerTimers.push(setTimeout(() => {
      if (!stillHere()) return;
      el.classList.add('is-on');
    }, buildIn));
    lowerTimers.push(setTimeout(() => {
      if (!stillHere()) return;
      el.classList.add('is-out');
    }, buildOut));
  }

  function armTimer(slide) {
    clearTimeout(advanceTimer);
    if (!leads) return;
    const spec = sectionSpec(current);
    const cycle = spec && spec.cycle;
    if (!deck.autoAdvance && !cycle) return;
    if (slide.dataset.kind === 'video') return;
    if (cycle) {
      advanceTimer = setTimeout(autoNext, cycle);
      return;
    }
    if (!deck.loop && current >= playOrder.length - 1) return;
    advanceTimer = setTimeout(autoNext, deck.autoAdvance);
  }

  function showSlide(n, fromRemote) {
    if (!playOrder.length) return;
    deckSlides().forEach(s => {
      s.classList.remove('active');
      s.setAttribute('aria-hidden', 'true');
    });
    document.querySelectorAll('video').forEach(video => {
      video.pause();
    });
    const item = playOrder[n];
    const slide = item.slide;
    slide.classList.add('active');
    slide.removeAttribute('aria-hidden');
    current = n;
    progress.style.width = ((n + 1) / playOrder.length * 100) + '%';
    restart(slide, '.content');
    restart(slide, '.kicker');
    restart(slide, '.bug');
    fitContent(slide);
    writeHash(n);
    settleAudio(slide, item.sectionIndex);
    armTimer(slide);
    if (slide.dataset.kind !== 'video') clearLowerThird();
    if (slide.dataset.kind === 'video') {
      startLowerThird(slide);
      const fit = slide.querySelector('video.video-fit') || slide.querySelector('video:not(.video-fill)');
      const fill = slide.querySelector('video.video-fill');
      if (fit) {
        // A missing file often never fires `error` until the browser finishes
        // the failed fetch. If no frame has arrived, treat the slide as the
        // black hold and move on. A real file clears this once it can play.
        advanceTimer = setTimeout(() => {
          if (!playOrder[current] || playOrder[current].slide !== slide) return;
          if (fit.readyState >= 2) return;
          autoNext();
        }, 1500);
        fit.addEventListener('loadeddata', () => {
          if (playOrder[current] && playOrder[current].slide === slide) clearTimeout(advanceTimer);
        }, { once: true });
        [fit, fill].forEach(video => {
          if (!video) return;
          video.load();
          try { video.currentTime = 0; } catch (err) {}
        });
        fit.play().catch(() => {});
      }
    }
    afterShow(n, fromRemote);
  }

  // From black, the first Next or Back only restores the picture, as in
  // PowerPoint, so a clicker never skips a slide the room has not seen.
  function nextSlide() {
    if (blacked) { requestState({ black: false }); return; }
    if (current < playOrder.length - 1) goTo(current + 1);
    else if (deck.loop && playOrder.length) goTo(0);
  }
  function prevSlide() {
    if (blacked) { requestState({ black: false }); return; }
    if (current > 0) goTo(current - 1);
    else if (deck.loop && playOrder.length) goTo(playOrder.length - 1);
  }
  function toggleBlack() {
    requestState({ black: !blacked });
  }
  function resetTimer() {
    requestState({ timerStart: Date.now() });
  }
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }

  document.querySelectorAll('.slide-video').forEach(slide => {
    const fit = slide.querySelector('video.video-fit') || slide.querySelector('video:not(.video-fill)');
    const fill = slide.querySelector('video.video-fill');
    if (!fit) return;
    fit.addEventListener('ended', () => {
      if (playOrder[current] && playOrder[current].slide === slide) autoNext();
    });
    fit.addEventListener('error', () => {
      if (!playOrder[current] || playOrder[current].slide !== slide) return;
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => {
        if (playOrder[current] && playOrder[current].slide === slide) autoNext();
      }, 1000);
    });
    const canvas = slide.querySelector('canvas.video-fill');
    if (!canvas) return;
    const ctx = canvas.getContext('2d', { alpha: false });
    const sizeCanvas = () => {
      const rect = slide.getBoundingClientRect();
      const w = Math.max(2, Math.round(rect.width / 6));
      const h = Math.max(2, Math.round(rect.height / 6));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    };
    const paint = () => {
      const w = fit.videoWidth;
      const h = fit.videoHeight;
      if (!w || !h) return;
      sizeCanvas();
      const scale = Math.max(canvas.width / w, canvas.height / h);
      const dw = w * scale;
      const dh = h * scale;
      ctx.drawImage(fit, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh);
    };
    let ticking = false;
    const tick = () => {
      paint();
      if (fit.paused || fit.ended) { ticking = false; return; }
      if (fit.requestVideoFrameCallback) fit.requestVideoFrameCallback(tick);
      else requestAnimationFrame(tick);
    };
    const start = () => {
      if (ticking) return;
      ticking = true;
      tick();
    };
    fit.addEventListener('play', start);
    fit.addEventListener('loadeddata', paint);
  });

  // Presentation clickers send PageDown/PageUp (some send B or . for blank),
  // the same keys PowerPoint and Proclaim answer to. A number then Enter
  // jumps to that slide. In the app, Swift's KeyMap takes the clicker keys
  // before the page sees them; the rest (numbers, Enter, N, P, S...) still
  // land here and go to Swift as requests.
  const nativeKeys = new Set(['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'ArrowLeft', 'ArrowUp', 'PageUp', 'Home', 'End', 'b', 'B', '.']);
  let typed = '';
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (nativeBridge && nativeKeys.has(k)) return;
    if (/^[0-9]$/.test(k)) { typed += k; return; }
    if (k === 'Enter' && typed) {
      const n = parseInt(typed, 10) - 1;
      typed = '';
      e.preventDefault();
      if (n >= 0 && n < playOrder.length) goTo(n);
      return;
    }
    typed = '';
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter' || k === 'n' || k === 'N') {
      e.preventDefault();
      nextSlide();
    } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace' || k === 'p' || k === 'P') {
      e.preventDefault();
      prevSlide();
    } else if (k === 'Home') {
      e.preventDefault();
      goTo(0);
    } else if (k === 'End') {
      e.preventDefault();
      goTo(playOrder.length - 1);
    } else if (k === 'b' || k === 'B' || k === '.') {
      e.preventDefault();
      toggleBlack();
    } else if (k === 's' || k === 'S') {
      e.preventDefault();
      toggleService();
    } else if (k === 'Escape') {
      closeService();
    } else if (k === 'f' || k === 'F') {
      toggleFullscreen();
    }
    unlock();
  });

  let touchStartX = 0;
  document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
  document.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff) > 50) {
      if (diff > 0) nextSlide(); else prevSlide();
    }
    unlock();
  });
  document.addEventListener('pointerdown', unlock);

  function unlock() {
    const slide = playOrder[current] && playOrder[current].slide;
    if (!slide) return;
    const fit = slide.querySelector('video.video-fit') || slide.querySelector('video:not(.video-fill)');
    if (fit) fit.play().catch(() => {});
    if (player.src) player.play().catch(() => {});
  }

  const transportActions = { prev: prevSlide, next: nextSlide, black: toggleBlack, timer: resetTimer };
  transport.querySelectorAll('[data-act]').forEach(button => {
    button.addEventListener('click', () => transportActions[button.dataset.act]());
  });

  playOrder = buildPlayOrder();
  buildServicePanel();

  // The surface the macOS app drives (Bridge.swift): it calls
  // presenter.apply({index, black, timerStart}); index counts play order.
  window.presenter = {
    view: view,
    count: playOrder.length,
    apply: applyState,
    state: () => ({ index: current, black: blacked, timerStart: timerStart }),
    titles: () => playOrder.map(item => slideLabel(item.slide).label),
  };

  // The first slide is local: a window that opens late must not pull the
  // others back. It asks them where they are instead.
  showSlide(indexFromHash(), true);
  post({ type: 'hello' });
  if (nativeBridge) {
    nativeBridge.postMessage({
      type: 'ready',
      view: viewAliases[askedView] ? askedView : view,
      count: playOrder.length,
      titles: window.presenter.titles(),
    });
  }
  setInterval(tick, 250);
  window.addEventListener('hashchange', () => {
    const n = indexFromHash();
    if (n !== current) goTo(n);
    else writeHash(n);
  });
  window.addEventListener('resize', () => {
    const slide = playOrder[current] && playOrder[current].slide;
    if (slide) fitContent(slide);
  });
</script>
</body>
</html>
