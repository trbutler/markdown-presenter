<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter controls</title><link rel="stylesheet" href="/control.css"></head>
<body>
<main>
  <header><div><h1>Presenter</h1><p>Little Hills · lower thirds</p></div><span id="connection" role="status">Connecting…</span></header>
  <section aria-label="Live output">
    <div class="preview"><iframe title="Live lower-third output" src="/output/lower-third"></iframe></div>
    <div class="output-bar"><span id="playback" aria-live="polite">Hidden</span><button id="clear" class="danger">Clear output</button></div>
    <p class="hint">Live output preview. Tap a cue to play; tap it again to take it out.</p>
  </section>
  <div id="message" role="alert" hidden></div>
  <section aria-labelledby="cues-heading"><div class="section-heading"><h2 id="cues-heading">Cues</h2><button id="new">New cue</button></div><div id="cues" class="cues"></div></section>
  <section id="editor" hidden aria-labelledby="editor-heading">
    <h2 id="editor-heading">Edit cue</h2>
    <form id="cue-form">
      <div class="fields"><label>Button label<input name="label" required maxlength="100"></label>
      <label>Theme<select name="theme"></select></label>
      <label>Layout<select name="variant"></select></label>
      <label>Font<select name="font"></select></label></div>
      <div id="content-fields" class="fields"></div>
      <label>Hold after build-in (seconds)<input name="holdSeconds" type="number" min="0" max="3600" step="0.1" value="10" required></label>
      <p class="hint">Changes apply the next time this cue is played. Long lines shrink to fit; very long text is clipped.</p>
      <div class="actions"><button type="submit" class="primary">Save cue</button><button id="cancel" type="button">Cancel</button><button id="delete" type="button" class="danger">Delete cue</button></div>
    </form>
  </section>
  <footer><a href="/output/lower-third" target="_blank" rel="noopener">Open OBS output</a><span>1920 × 1080 · transparent background</span></footer>
</main>
<script type="module" src="/js/control.js"></script>
</body></html>
